<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>

        /* Page styling */

        body {

            margin: 0;

            padding: 0;

            font-family: Arial, sans-serif;

            background: linear-gradient(to bottom right, #1e3c72, #2a5298);

            color: white;

            text-align: center;

        }

 

        /* Image styling */

        img {

            margin-top: 50px;

            width: 250px;

            height: auto;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.5);

        }

 

        /* Name animation */

        h1 {

            font-size: 3em;

            margin-top: 20px;

            animation: fadeInMove 3s ease-in-out infinite alternate;

        }

 

        /* Keyframes for animation */

        @keyframes fadeInMove {

            0% {

                opacity: 0;

                transform: translateY(-20px);

            }

            50% {

                opacity: 1;

                transform: translateY(0);

            }

            100% {

                opacity: 0.7;

                transform: translateY(20px);

            }

        }

    </style>

</head>

<body>

 

    <!-- Replace 'Mhdsalih.jpg' with your image file path -->

    <img src="Mhdsalih.jpg" alt="Mhdsalih">

 

    <!-- Replace 'Muhammed salih Nazarulla' with your actual name -->

    <h1>Muhammed salih </h1>

 

</body>

</html>
